name: Build Custom QuickLook EXE
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Skip Installer and ARM64 Projects
        shell: powershell
        run: |
          [xml]$slnx = Get-Content QuickLook.slnx
          $slnx.SelectNodes("//Project[contains(@Path, 'QuickLook.Installer') or contains(@Path, 'NativeArm64')]") | ForEach-Object { [void]$_.ParentNode.RemoveChild($_) }
          $slnx.Save("$PWD\QuickLook.slnx")
      - name: Build Full QuickLook
        run: msbuild QuickLook.slnx -restore -p:Configuration=Release -p:Platform="Any CPU" -m
      - name: Package QuickLook Folder
        shell: powershell
        run: |
          $exe = Get-ChildItem -Recurse -Filter "QuickLook.exe" | Where-Object { $_.FullName -notmatch "\\obj\\" } | Select-Object -First 1
          if (-not $exe) { throw "QuickLook.exe not found!" }
          Copy-Item -Path $exe.Directory.FullName -Destination "QuickLook-Custom" -Recurse
      - name: Upload Custom QuickLook
        uses: actions/upload-artifact@v4
        with:
          name: QuickLook-Custom
          path: QuickLook-Custom
